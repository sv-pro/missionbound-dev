[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missionbound-dev"
version = "0.1.0"
description = "Run a coding agent inside a mission: requirements it cannot edit, phases it cannot skip, a goal it cannot declare early."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mission = "missionbound_dev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
